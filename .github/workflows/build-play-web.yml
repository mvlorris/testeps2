name: Build Orion PS2 WebAssembly

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-play-web.yml'
      - 'emulator/**'

permissions:
  contents: read

jobs:
  build-play-web:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Orion
        uses: actions/checkout@v4

      - name: Checkout Play! source
        uses: actions/checkout@v4
        with:
          repository: jpd002/Play-
          path: emulator/Play
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 git

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache
      - name: Disable pthread flags for static GitHub Pages
        run: |
          sed -i '/CMAKE_CXX_FLAGS.*-pthread/d' emulator/Play/deps/Dependencies/cmake-modules/Header.cmake
          sed -i '/CMAKE_CXX_FLAGS.*-pthread/d' emulator/Play/deps/CodeGen/CMakeLists.txt
          sed -i 's/if(NOT (TARGET_PLATFORM_ANDROID OR TARGET_PLATFORM_IOS))/if(NOT EMSCRIPTEN AND NOT (TARGET_PLATFORM_ANDROID OR TARGET_PLATFORM_IOS))/' emulator/Play/Source/CMakeLists.txt

      - name: Configure Play! web build
        working-directory: emulator/Play
        run: |
          mkdir -p build
          cd build
          emcmake cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_PLAY=ON -DBUILD_PSFPLAYER=ON -DUSE_QT=OFF -DZSTD_MULTITHREAD_SUPPORT=OFF

      - name: Compile Play! WebAssembly
        working-directory: emulator/Play
        run: cmake --build build --config Release

      - name: Collect emulator artifacts
        run: |
          mkdir -p emulator-artifacts
          find emulator/Play -type f \( -name 'Play.js' -o -name 'Play.wasm' \) -print -exec cp {} emulator-artifacts/ \;
          test -s emulator-artifacts/Play.js
          test -s emulator-artifacts/Play.wasm

      - name: Upload emulator artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orion-play-webassembly
          path: emulator-artifacts/
